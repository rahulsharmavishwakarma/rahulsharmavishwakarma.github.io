<style>
.dfig{margin:2rem 0;padding:1rem 1.1rem .9rem;background:var(--global-card-bg-color);border:1px solid var(--global-divider-color);border-radius:12px;font-size:.9rem;line-height:1.5;color:var(--global-text-color)}
.dfig *{box-sizing:border-box}
.dfig-title{font-family:var(--font-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--global-theme-color);margin-bottom:.8rem}
.dfig-cap{text-align:left;font-size:.8rem;color:var(--global-text-color-light);margin-top:.85rem;line-height:1.55}
.dfig-cap b{color:var(--global-text-color);font-weight:600}
.dctl{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin-top:.75rem}
.dbtn{font-family:var(--font-mono);font-size:.74rem;padding:.3rem .75rem;border:1px solid var(--global-divider-color);background:transparent;color:var(--global-text-color);border-radius:999px;cursor:pointer;transition:border-color .2s,color .2s}
.dbtn:hover,.dbtn[aria-pressed=true]{border-color:var(--global-theme-color);color:var(--global-theme-color)}
.dbtn:focus-visible,.dfig input[type=range]:focus-visible{outline:2px solid var(--global-theme-color);outline-offset:2px}
.dnote{font-size:.78rem;color:var(--global-text-color-light)}
.dlane{border:1px solid var(--global-divider-color);border-radius:8px;padding:.55rem .7rem;margin-bottom:.6rem;background:var(--global-bg-color)}
.dlane-h{display:flex;justify-content:space-between;gap:.5rem;flex-wrap:wrap;font-family:var(--font-mono);font-size:.7rem;color:var(--global-text-color-light);margin-bottom:.35rem}
.dlane-h b{color:var(--global-text-color);font-weight:600}
.dtokrow{display:flex;flex-wrap:wrap;align-items:flex-start}
.dcol{display:flex;flex-direction:column;align-items:center;margin:2px}
.dtok{display:inline-flex;align-items:center;justify-content:center;min-width:2rem;height:2rem;padding:0 .45rem;border-radius:6px;font-family:var(--font-mono);font-size:.76rem;border:1px solid var(--global-divider-color);color:var(--global-text-color);background:var(--global-card-bg-color);transition:border-color .3s,background .3s,color .3s}
.dtok.m{color:transparent;border-style:dashed;background:repeating-linear-gradient(45deg,transparent 0 4px,var(--global-divider-color) 4px 5px)}
.dtok.on{border-color:var(--global-theme-color)}
.dtok.bad{border-color:#e5484d;background:rgba(229,72,77,.14)}
.dtok.ok{border-color:#42b983;background:rgba(66,185,131,.16)}
.dtok.flag{animation:dflag .8s ease-in-out infinite alternate}
.dtok.pop{animation:dpop .55s ease-out}
@keyframes dpop{0%{transform:scale(.7);background:var(--global-theme-color);color:var(--global-bg-color)}100%{transform:scale(1)}}
@keyframes dflag{from{box-shadow:0 0 0 0 rgba(229,72,77,.0)}to{box-shadow:0 0 0 4px rgba(229,72,77,.35)}}
.dbar{width:100%;height:26px;display:flex;align-items:flex-end;justify-content:center;margin-top:3px}
.dbar i{display:block;width:60%;background:var(--global-theme-color);border-radius:2px 2px 0 0;opacity:.75;transition:height .3s}
.dlossl{height:26px;margin-top:3px;font-family:var(--font-mono);font-size:.62rem;color:var(--global-theme-color);display:flex;align-items:flex-end}
.dfig input[type=range]{width:100%;accent-color:var(--global-theme-color)}
.dfig label{font-family:var(--font-mono);font-size:.72rem;color:var(--global-text-color-light);display:block;margin-top:.7rem}
.dfig label b{color:var(--global-text-color)}
.dstat{font-family:var(--font-mono);font-size:.78rem;margin-top:.6rem;min-height:2.6em}
@media (prefers-reduced-motion:reduce){.dtok,.dbar i,.dseg{transition:none!important}.dtok.pop,.dtok.flag{animation:none!important}}
</style>
<script>
window.dfig={
  reduced:window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches,
  el:function(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;},
  whenVisible:function(node,fn){
    if(!('IntersectionObserver' in window)){fn();return;}
    var io=new IntersectionObserver(function(es){if(es[0].isIntersecting){io.disconnect();fn();}},{threshold:.4});
    io.observe(node);
  }
};
</script>
